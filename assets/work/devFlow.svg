<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="50%" stop-color="#181924" />
      <stop offset="100%" stop-color="#0e0f14" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff99" />
      <stop offset="100%" stop-color="#00d8f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#devBg)" />

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#20222e" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="65" cy="50" r="6" fill="#ff5f56" />
  <circle cx="85" cy="50" r="6" fill="#ffbd2e" />
  <circle cx="105" cy="50" r="6" fill="#27c93f" />
  <text x="400" y="55" fill="#a0a4b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">devflow.workspace.app/board/realtime-sprint</text>

  <!-- App Dashboard UI Frame -->
  <rect x="40" y="85" width="720" height="375" rx="12" fill="#161720" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- Left Sidebar -->
  <rect x="40" y="85" width="160" height="375" fill="#1b1c27" />
  <line x1="200" y1="85" x2="200" y2="460" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="65" y="125" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">DevFlow</text>
  
  <rect x="55" y="150" width="130" height="30" rx="6" fill="#00ff99" fill-opacity="0.15" />
  <text x="70" y="170" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="12"># sprints-live</text>
  <text x="70" y="210" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="12"># backend-api</text>
  <text x="70" y="245" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="12"># system-design</text>

  <!-- Live Users Online Indicator -->
  <rect x="55" y="390" width="130" height="45" rx="8" fill="#111219" stroke="#00ff99" stroke-opacity="0.3" />
  <circle cx="75" cy="412" r="5" fill="#00ff99" />
  <text x="90" y="416" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">4 Peers Active</text>

  <!-- Main KanBan Columns -->
  <!-- Col 1: In Progress -->
  <rect x="220" y="110" width="160" height="325" rx="8" fill="#1f202c" stroke="#ffffff" stroke-opacity="0.05" />
  <text x="235" y="135" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">In Progress (3)</text>
  <rect x="230" y="155" width="140" height="75" rx="6" fill="#282a3a" />
  <text x="240" y="180" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Redis Pub/Sub Sync</text>
  <rect x="240" y="195" width="55" height="18" rx="3" fill="#00ff99" fill-opacity="0.2" />
  <text x="248" y="208" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="9">Socket.io</text>

  <rect x="230" y="240" width="140" height="75" rx="6" fill="#282a3a" />
  <text x="240" y="265" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Postgres Schema</text>
  <rect x="240" y="280" width="55" height="18" rx="3" fill="#336791" fill-opacity="0.3" />
  <text x="248" y="293" fill="#69b0e2" font-family="'JetBrains Mono', monospace" font-size="9">Prisma</text>

  <!-- Col 2: Code Review -->
  <rect x="400" y="110" width="160" height="325" rx="8" fill="#1f202c" stroke="#ffffff" stroke-opacity="0.05" />
  <text x="415" y="135" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">Code Review (2)</text>
  <rect x="410" y="155" width="140" height="85" rx="6" fill="#282a3a" stroke="#00ff99" stroke-opacity="0.4" />
  <text x="420" y="180" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OAuth2 Provider</text>
  <text x="420" y="200" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="10">PR #42 by Rakib</text>
  <rect x="420" y="210" width="60" height="18" rx="3" fill="#00ff99" fill-opacity="0.2" />
  <text x="428" y="223" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="9">Approved</text>

  <!-- Col 3: Live Real-Time Feed -->
  <rect x="580" y="110" width="165" height="325" rx="8" fill="#1f202c" stroke="#ffffff" stroke-opacity="0.05" />
  <text x="595" y="135" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">Live WebSockets</text>
  
  <rect x="590" y="155" width="145" height="50" rx="6" fill="#242634" />
  <text x="600" y="175" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">⚡ WS Latency: 18ms</text>
  <text x="600" y="193" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="9">Event broadcast ok</text>

  <rect x="590" y="215" width="145" height="50" rx="6" fill="#242634" />
  <text x="600" y="235" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">👥 Presence Sync</text>
  <text x="600" y="253" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="9">Room: sprint-7</text>

  <rect x="590" y="275" width="145" height="60" rx="6" fill="#242634" />
  <text x="600" y="295" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="10">🔐 JWT Verified</text>
  <text x="600" y="313" fill="#8d92a8" font-family="'JetBrains Mono', monospace" font-size="9">Token auto-refresh</text>
</svg>

