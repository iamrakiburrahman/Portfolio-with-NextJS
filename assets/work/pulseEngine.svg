<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#1c1c22" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff99" />
      <stop offset="100%" stop-color="#00c875" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Top App Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#232329" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="65" cy="50" r="6" fill="#ff5f56" />
  <circle cx="85" cy="50" r="6" fill="#ffbd2e" />
  <circle cx="105" cy="50" r="6" fill="#27c93f" />
  <text x="400" y="55" fill="#a0a0a8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">api.pulse-engine.internal/v1/health</text>

  <!-- Main Architecture Canvas -->
  <rect x="40" y="85" width="720" height="375" rx="12" fill="#18181c" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- Node 1: API Gateway -->
  <rect x="70" y="195" width="130" height="100" rx="8" fill="#232329" stroke="#00ff99" stroke-width="1.5" filter="url(#glow)" />
  <text x="135" y="235" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="135" y="260" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Nginx + Reverse</text>
  <text x="135" y="280" fill="#888894" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Rate-Limited</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 200 245 L 260 245" stroke="#00ff99" stroke-width="2" stroke-dasharray="4 2" />
  <polygon points="265,245 255,240 255,250" fill="#00ff99" />

  <!-- Node 2: NestJS Core Cluster -->
  <rect x="270" y="150" width="220" height="190" rx="10" fill="#232329" stroke="#ffffff" stroke-opacity="0.15" />
  <rect x="270" y="150" width="220" height="35" rx="10" fill="#2d2d34" />
  <text x="380" y="173" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">NestJS Microservices</text>
  
  <rect x="290" y="200" width="180" height="32" rx="6" fill="#1c1c22" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="380" y="221" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Auth &amp; RBAC Service</text>

  <rect x="290" y="245" width="180" height="32" rx="6" fill="#1c1c22" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="380" y="266" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Workflow Queue (BullMQ)</text>

  <rect x="290" y="290" width="180" height="32" rx="6" fill="#1c1c22" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="380" y="311" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Event Broker (Redis)</text>

  <!-- Connections to Databases -->
  <path d="M 490 205 L 560 170" stroke="#00ff99" stroke-width="2" />
  <path d="M 490 285 L 560 320" stroke="#00ff99" stroke-width="2" />

  <!-- Node 3: PostgreSQL Database -->
  <rect x="560" y="130" width="160" height="85" rx="8" fill="#232329" stroke="#336791" stroke-width="2" />
  <text x="640" y="165" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL + Prisma</text>
  <text x="640" y="190" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Indexed Relational DB</text>

  <!-- Node 4: Redis In-Memory Cache -->
  <rect x="560" y="280" width="160" height="85" rx="8" fill="#232329" stroke="#d82c20" stroke-width="2" />
  <text x="640" y="315" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">Redis Cluster</text>
  <text x="640" y="340" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Sub-5ms Cache &amp; PubSub</text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#232329" stroke="#00ff99" stroke-opacity="0.4" />
    <text x="70" y="25" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡ 1,500+ Req/s</text>

    <rect x="160" y="0" width="140" height="40" rx="6" fill="#232329" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="230" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">⏱️ 38ms Latency</text>

    <rect x="320" y="0" width="150" height="40" rx="6" fill="#232329" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="395" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">🔒 JWT + RBAC</text>

    <rect x="490" y="0" width="170" height="40" rx="6" fill="#232329" stroke="#00ff99" stroke-opacity="0.4" />
    <text x="575" y="25" fill="#00ff99" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">🐳 Docker Ready</text>
  </g>
</svg>

